<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>원팀 행사 정산</title>
<meta name="theme-color" content="#5d7a3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* 폰 한 손 정산표: 위에 전체 합계(남은 돈), 아래로 항목별 카드. 카드마다 결제를 여러 번 적는다. */
  :root {
    --bg: #f7f6f1; --surface: #ffffff; --ink: #24261f; --muted: #6c6f63; --line: #e3e2d8;
    --accent: #5d7a3a; --accent-soft: #eaf0df; --over: #b3412f; --over-soft: #f8e4df;
    --on-accent: #ffffff;
    --f-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171914; --surface: #20231c; --ink: #eef0e8; --muted: #a8ad9c; --line: #343829;
      --accent: #a6c97a; --accent-soft: #2a3420; --over: #f08a76; --over-soft: #3a221d;
      --on-accent: #171914; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.5; word-break: keep-all; }
  .wrap { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; display: grid; gap: 16px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 19px; margin: 0; }
  .num { font-variant-numeric: tabular-nums; }
  button { font: inherit; cursor: pointer; }
  input { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 전체 합계 */
  .total { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--accent); color: var(--on-accent); border-radius: 16px; padding: 14px 16px; display: grid; gap: 8px; }
  .total.over { background: var(--over); }
  .total .left { font-size: 28px; font-weight: 700; line-height: 1.2; }
  .total .left small { font-size: 15px; font-weight: 500; opacity: .9; }
  .total .row { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; opacity: .95; flex-wrap: wrap; }
  .meter { height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--on-accent) 30%, transparent); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--on-accent); border-radius: 4px; }

  .people { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 20px; }
  .stepper b { min-width: 3ch; text-align: center; font-size: 19px; }

  /* 항목 카드 */
  .item { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
  .item header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .item header small { color: var(--muted); font-size: 14px; }
  .status { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; color: var(--muted); }
  .status b { color: var(--ink); }
  .status .ok { color: var(--accent); font-weight: 700; }
  .status .bad { color: var(--over); font-weight: 700; }
  .bar { height: 8px; border-radius: 4px; background: var(--accent-soft); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .bar.over i { background: var(--over); }

  .pays { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .pay { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--bg); }
  .pay .memo { min-width: 0; font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
  .pay .amt { font-weight: 700; }
  .pay .x { border: 0; background: none; color: var(--muted); font-size: 18px; width: 32px; height: 32px; }
  .rcpt { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 8px; font-size: 12px; padding: 3px 7px; white-space: nowrap; }
  .rcpt.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 700; }

  .add { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .add input { width: 100%; min-width: 0; padding: 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-size: 17px; }
  .add .amt-in { font-variant-numeric: tabular-nums; }
  .add button { padding: 0 18px; border-radius: 12px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 700; }
  .add input[id^="memo-"] { grid-column: 1 / -1; }
  .add .preview { grid-column: 1 / -1; font-size: 14px; color: var(--muted); min-height: 1.4em; margin-top: -4px; }
  .add .preview.err { color: var(--over); }

  .quick { display: flex; flex-wrap: wrap; gap: 6px; }
  .quick button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 5px 12px; font-size: 14px; }

  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tools button { padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 500; }
  .tools .danger { color: var(--over); }
  .confirm { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; justify-content: space-between; background: var(--over-soft); border-radius: 12px; padding: 10px 12px; font-size: 15px; }
  .confirm button { border: 0; background: var(--over); color: var(--on-accent); border-radius: 10px; padding: 8px 14px; font-weight: 700; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .fine { color: var(--muted); font-size: 14px; margin: 0; }
  textarea.copybox { width: 100%; min-height: 160px; font: 14px/1.5 var(--f-body); padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

  /* 주문 줄: 메뉴 · 단가 × 수량 = 소계 */
  .lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .line { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; padding: 8px 10px; border-radius: 10px; background: var(--bg); }
  .line .what { min-width: 0; overflow-wrap: anywhere; }
  .line .what small { display: block; color: var(--muted); font-size: 14px; }
  .line .sub { font-weight: 700; text-align: right; align-self: center; }
  .line .ctl { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; }
  .line .ctl button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 18px; line-height: 1; }
  .line .ctl b { min-width: 2.5ch; text-align: center; }
  .line .ctl .x { margin-left: auto; width: auto; padding: 0 8px; border: 0; background: none; color: var(--muted); font-size: 14px; }
  .count { font-size: 14px; color: var(--muted); }
  .count.warn { color: var(--over); font-weight: 700; }
  .add3 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .add3 input { width: 100%; min-width: 0; padding: 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-size: 17px; }
  .add3 .full { grid-column: 1 / -1; }
  .add3 .qty { display: flex; align-items: center; justify-content: space-between; gap: 6px; border: 1.5px solid var(--line); border-radius: 12px; padding: 4px 6px; background: var(--surface); }
  .add3 .qty button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 18px; }
  .add3 .go { border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 700; padding: 12px; }
  .add3 .preview { grid-column: 1 / -1; font-size: 14px; color: var(--muted); min-height: 1.4em; margin: -2px 0 0; }
  .add3 .preview.err { color: var(--over); }
  .card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>원팀 행사 정산 <span class="fine" style="font-size:15px">10/14 · 6조</span></h1>

  <section class="total num" id="total" aria-live="polite">
    <div class="left" id="t-left"></div>
    <div class="meter"><i id="t-meter"></i></div>
    <div class="row"><span id="t-spent"></span><span id="t-budget"></span></div>
    <div class="row"><span id="t-per"></span></div>
  </section>

  <div class="people">
    <span>인원</span>
    <div class="stepper">
      <button id="p-minus" aria-label="한 명 빼기">−</button>
      <b class="num" id="p-count">12</b>
      <button id="p-plus" aria-label="한 명 더하기">+</button>
    </div>
  </div>

  <div id="items" style="display:grid;gap:16px"></div>

  <div class="tools">
    <button id="copy">정산 내용 복사</button>
    <button id="reset" class="danger">모두 지우기</button>
    <div class="confirm" id="confirm" hidden>
      <span>적은 내용이 모두 지워져요.</span>
      <span style="display:flex;gap:8px">
        <button id="confirm-no" style="background:var(--surface);color:var(--ink)">취소</button>
        <button id="confirm-yes">지우기</button>
      </span>
    </div>
    <textarea class="copybox" id="copybox" hidden readonly></textarea>
  </div>

  <p class="fine">이 폰의 브라우저에만 저장돼요. 다른 폰이나 카톡 안 브라우저에서 열면 비어 있어요. 끝나면 '정산 내용 복사'로 따로 보관해두세요.</p>
</div>
<div class="toast" id="toast"></div>

<script>
// 원팀 행사(10/14) 당일 지출 정산. 진행하는 한 사람이 자기 폰에서 쓰는 도구라
// 서버 없이 이 브라우저(localStorage)에만 저장한다.
//
// 사람마다 시키는 게 달라서 한 항목을 '메뉴 · 단가 × 수량' 줄 여러 개로 적는다.
// 같은 메뉴가 여러 잔이면 수량만 올리면 된다.
const STORE = 'oneteam-calc-v2';

// 예산은 안내문의 1인 금액 그대로. perHead × 인원이 그 항목 예산이다.
const ITEMS = [
  { key: 'cafe',  name: '더바움 서울역점', sub: '10:00 카페',          perHead: 10000, unit: '잔', hint: '아메리카노' },
  { key: 'lunch', name: '도온 서울역점',   sub: '11:20 점심',          perHead: 20000, unit: '개', hint: '메뉴 이름' },
  { key: 'class', name: '셀갸또',          sub: '13:00 케이크 클래스', perHead: 70000, unit: '명', hint: '생과일 케이크', preset: { name: '생과일 케이크 클래스', price: 70000 } },
  { key: 'etc',   name: '기타',            sub: '택시, 물, 간식 등',   perHead: 0,     unit: '개', hint: '택시' },
];
const PER_HEAD_BUDGET = 100000;

const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); for (const k of kids) e.append(k); return e; };
const won = (n) => Math.round(n).toLocaleString('ko-KR') + '원';

// ===================== 저장 =====================
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE));
    if (s && s.lines) return s;
  } catch {}
  return { people: 12, lines: {}, rcpt: {} };   // lines: { itemKey: [{ name, price, qty }] }
}
let state = loadState();
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch {} }

// ===================== 계산식 =====================
// 단가 칸에 '4500+500'(샷 추가) 같은 식을 받는다. eval 대신 작은 파서로
// 숫자와 + - * / ( )만 읽는다. 쉼표, '원', 'x', '×', '만'(=10000)은 편하게 쓰라고 받아준다.
function calc(src) {
  const s = String(src).replace(/[,\s원]/g, '').replace(/[x×X]/g, '*').replace(/÷/g, '/')
    .replace(/(\d+(?:\.\d+)?)만(\d*)/g, (_, a, b) => String(parseFloat(a) * 10000 + (b ? parseInt(b, 10) : 0)));
  if (!s) return null;
  let i = 0;
  const peek = () => s[i];
  function num() {
    const m = /^\d+(\.\d+)?/.exec(s.slice(i));
    if (!m) throw new Error();
    i += m[0].length;
    return parseFloat(m[0]);
  }
  function atom() {
    if (peek() === '(') { i++; const v = expr(); if (peek() !== ')') throw new Error(); i++; return v; }
    if (peek() === '-') { i++; return -atom(); }
    return num();
  }
  function term() {
    let v = atom();
    while (peek() === '*' || peek() === '/') {
      const op = s[i++]; const r = atom();
      if (op === '/' && r === 0) throw new Error();
      v = op === '*' ? v * r : v / r;
    }
    return v;
  }
  function expr() {
    let v = term();
    while (peek() === '+' || peek() === '-') { const op = s[i++]; const r = term(); v = op === '+' ? v + r : v - r; }
    return v;
  }
  try {
    const v = expr();
    if (i !== s.length || !isFinite(v)) return NaN;
    return Math.round(v);
  } catch { return NaN; }
}

// ===================== 화면 =====================
const linesOf = (k) => state.lines[k] || [];
const spentOf = (k) => linesOf(k).reduce((a, l) => a + l.price * l.qty, 0);
const qtyOf = (k) => linesOf(k).reduce((a, l) => a + l.qty, 0);

function renderTotal() {
  const n = state.people;
  const budget = PER_HEAD_BUDGET * n;
  const spent = ITEMS.reduce((a, it) => a + spentOf(it.key), 0);
  const left = budget - spent;
  $('total').classList.toggle('over', left < 0);
  $('t-left').innerHTML = left >= 0 ? `${won(left)} <small>남음</small>` : `${won(-left)} <small>넘음</small>`;
  $('t-meter').style.width = Math.min(100, budget ? spent / budget * 100 : 0) + '%';
  $('t-spent').textContent = `쓴 돈 ${won(spent)}`;
  $('t-budget').textContent = `예산 ${won(budget)} (1인 10만 × ${n})`;
  $('t-per').textContent = `1인당 ${won(n ? spent / n : 0)}`;
}

function renderItem(it) {
  const n = state.people;
  const budget = it.perHead * n;
  const spent = spentOf(it.key);
  const card = el('section', { className: 'item', id: 'item-' + it.key });
  card.append(el('header', {}, el('h2', { textContent: it.name }), el('small', { textContent: it.sub })));

  if (budget) {
    const diff = budget - spent;
    card.append(
      el('div', { className: 'status num' },
        el('span', {}, '쓴 돈 ', el('b', { textContent: won(spent) }), ` / ${won(budget)}`),
        el('span', { className: diff >= 0 ? 'ok' : 'bad', textContent: diff >= 0 ? `${won(diff)} 남음` : `${won(-diff)} 넘음` })),
      el('div', { className: 'bar' + (diff < 0 ? ' over' : '') }, Object.assign(el('i'), { style: `width:${Math.min(100, spent / budget * 100)}%` })));
  } else if (spent) {
    card.append(el('div', { className: 'status num' }, el('span', {}, '쓴 돈 ', el('b', { textContent: won(spent) }))));
  }

  // 주문 줄
  const list = el('ul', { className: 'lines' });
  linesOf(it.key).forEach((l, idx) => {
    const set = (q) => { if (q < 1) return; l.qty = q; save(); render(); };
    const minus = el('button', { textContent: '−', 'aria-label': '하나 빼기' }); minus.onclick = () => set(l.qty - 1);
    const plus = el('button', { textContent: '+', 'aria-label': '하나 더하기' }); plus.onclick = () => set(l.qty + 1);
    const x = el('button', { className: 'x', textContent: '지우기' });
    x.onclick = () => { linesOf(it.key).splice(idx, 1); save(); render(); toast('지웠어요'); };
    list.append(el('li', { className: 'line num' },
      el('div', { className: 'what' }, l.name || '(이름 없음)', el('small', { textContent: `${won(l.price)} × ${l.qty}${it.unit}` })),
      el('div', { className: 'sub', textContent: won(l.price * l.qty) }),
      el('div', { className: 'ctl' }, minus, el('b', { textContent: l.qty }), plus, x)));
  });
  if (list.children.length) card.append(list);

  // 입력: 메뉴 / 단가(계산식 가능) / 수량
  let qty = 1;
  const name = el('input', { id: 'name-' + it.key, placeholder: `메뉴 (예: ${it.hint})`, autocomplete: 'off', className: 'full' });
  const price = el('input', { id: 'price-' + it.key, placeholder: '단가', inputMode: 'text', autocomplete: 'off', enterKeyHint: 'done' });
  const qv = el('b', { className: 'num', textContent: '1' });
  const qm = el('button', { textContent: '−', 'aria-label': '수량 빼기' });
  const qp = el('button', { textContent: '+', 'aria-label': '수량 더하기' });
  const preview = el('p', { className: 'preview num' });
  const update = () => {
    const v = calc(price.value);
    preview.className = 'preview num' + (Number.isNaN(v) ? ' err' : '');
    preview.textContent = v === null ? '' : Number.isNaN(v) ? '단가를 다시 확인해주세요' : `${won(v)} × ${qty}${it.unit} = ${won(v * qty)}`;
  };
  qm.onclick = () => { if (qty > 1) { qty--; qv.textContent = qty; update(); } };
  qp.onclick = () => { qty++; qv.textContent = qty; update(); };
  const go = el('button', { className: 'go full', textContent: '추가' });
  const add = () => {
    const v = calc(price.value);
    if (v === null || Number.isNaN(v) || v <= 0) { update(); price.focus(); return; }
    const nm = name.value.trim();
    // 같은 이름·같은 단가가 이미 있으면 새 줄을 만들지 않고 수량만 더한다.
    const same = linesOf(it.key).find((l) => l.name === nm && l.price === v);
    if (same) same.qty += qty; else (state.lines[it.key] ||= []).push({ name: nm, price: v, qty });
    save(); render(); toast(`${nm || it.name} ${qty}${it.unit} 추가했어요`);
  };
  price.oninput = update;
  name.onkeydown = price.onkeydown = (e) => { if (e.key === 'Enter') add(); };
  go.onclick = add;
  card.append(el('div', { className: 'add3' }, name, price, el('div', { className: 'qty' }, qm, qv, qp), preview, go));

  if (it.preset) {
    const q = el('div', { className: 'quick' });
    const b = el('button', { textContent: `${it.preset.name} ${won(it.preset.price)} × ${n}명` });
    b.onclick = () => { name.value = it.preset.name; price.value = String(it.preset.price); qty = n; qv.textContent = qty; update(); };
    q.append(b);
    card.append(q);
  }

  // 수량 합계와 영수증. 카페·점심은 인원과 수량이 맞는지 보기 쉽게 같이 보여준다.
  const total = qtyOf(it.key);
  const foot = el('div', { className: 'card-foot' });
  if (total) {
    const off = it.key !== 'etc' && total !== n;
    foot.append(el('span', { className: 'count num' + (off ? ' warn' : ''), textContent: `모두 ${total}${it.unit}` + (it.key !== 'etc' ? ` · 인원 ${n}명` : '') }));
  } else foot.append(el('span'));
  const r = el('button', { className: 'rcpt' + (state.rcpt[it.key] ? ' on' : ''), textContent: state.rcpt[it.key] ? '영수증 받음 ✓' : '영수증' });
  r.onclick = () => { state.rcpt[it.key] = !state.rcpt[it.key]; save(); render(); };
  foot.append(r);
  card.append(foot);
  return card;
}

function render() {
  $('p-count').textContent = state.people;
  renderTotal();
  $('items').replaceChildren(...ITEMS.map(renderItem));
}

// ===================== 인원 · 도구 =====================
$('p-minus').onclick = () => { if (state.people > 1) { state.people--; save(); render(); } };
$('p-plus').onclick = () => { state.people++; save(); render(); };

function summary() {
  const n = state.people;
  const lines = [`[원팀 행사 정산] 10/14 · ${n}명`];
  let all = 0;
  for (const it of ITEMS) {
    const ls = linesOf(it.key);
    if (!ls.length) continue;
    const sum = spentOf(it.key); all += sum;
    lines.push('', `■ ${it.name}  ${won(sum)}${state.rcpt[it.key] ? ' (영수증)' : ''}`);
    for (const l of ls) lines.push(`  - ${l.name || '(이름 없음)'} ${won(l.price)} × ${l.qty} = ${won(l.price * l.qty)}`);
  }
  lines.push('', `합계 ${won(all)} · 1인 ${won(n ? all / n : 0)}`, `예산 ${won(PER_HEAD_BUDGET * n)} · ${all <= PER_HEAD_BUDGET * n ? '남음 ' + won(PER_HEAD_BUDGET * n - all) : '넘음 ' + won(all - PER_HEAD_BUDGET * n)}`);
  return lines.join('\n');
}

$('copy').onclick = async () => {
  const text = summary();
  try { await navigator.clipboard.writeText(text); toast('복사했어요. 카톡에 붙여넣으세요'); $('copybox').hidden = true; }
  catch { const b = $('copybox'); b.value = text; b.hidden = false; b.focus(); b.select(); toast('아래 글을 길게 눌러 복사하세요'); }
};
$('reset').onclick = () => { $('confirm').hidden = false; };
$('confirm-no').onclick = () => { $('confirm').hidden = true; };
$('confirm-yes').onclick = () => { state = { people: 12, lines: {}, rcpt: {} }; save(); $('confirm').hidden = true; render(); toast('모두 지웠어요'); };

let tt;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1800); }

render();
</script>
</body>
</html>
